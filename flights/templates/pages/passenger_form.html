<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
</head>
<body>
    <h2>{{ title }}</h2>

    <!-- Form protected against CSRF -->
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save Passenger</button>
        <a href="{% url 'dashboard' %}">Cancel</a>
    </form>
</body>
</html>
